<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#082f26"><title>ضربات الجزاء | Matiko Stadium</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="games.css"><link rel="stylesheet" href="game3d.css"></head><body class="single-game-page" data-game="penalty"><main class="single-game-wrap"><a class="back-to-stadium" href="index.html#games">← العودة إلى الملعب</a><header class="game3d-heading"><span class="single-game-kicker">MATIKO 3D FOOTBALL ARENA</span><h1>ضربات الجزاء</h1><p>من خلف اللاعب نحو المرمى والحارس — سجّل أكبر عدد من الأهداف.</p></header><section class="game3d-panel"><div class="game3d-wrap" id="game3d"></div><div class="game3d-hud"><div class="game3d-control"><label for="aim"><span>اتجاه التسديد</span><b id="aimValue">الوسط</b></label><input id="aim" type="range" min="0" max="100" value="50"></div><div class="game3d-control"><label for="power"><span>قوة التسديد</span><b id="powerValue">72%</b></label><input id="power" type="range" min="25" max="100" value="72"></div></div><div class="feedback" id="feedback">استعد للتسديد!</div><p class="game3d-hint" id="hint">اضبط اتجاه وقوة التسديدة ثم اضغط سدد.</p><div class="game3d-buttons"><button id="shoot">⚽ سدد الآن</button><button id="restart" class="secondary">إعادة اللعب</button></div><div class="game-scoreline"><span>الأهداف: <strong id="score">0</strong></span><span>التسديدات <b id="attempts">0</b></span></div><div class="game3d-register hidden" id="register"><label for="playerName">اكتب اسمك لتسجيل نتيجتك</label><input id="playerName" maxlength="24" placeholder="اسم اللاعب"><button id="save">سجّل نتيجتي</button><p id="saveStatus" class="game3d-hint"></p></div><div class="game3d-leaderboard"><h2>🏆 أفضل 10 لاعبين</h2><ol id="top10"></ol></div></section></main><script type="module" src="game3d.js"></script></body></html>
