<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#082f26"><title>تحدي معرفة اللاعبين | Matiko Stadium</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="games.css"><link rel="stylesheet" href="players.css"></head>
<body class="single-game-page"><main class="single-game-wrap"><a class="back-to-stadium" href="index.html#games">← العودة إلى الملعب</a><header class="players-heading"><span>MATIKO FOOTBALL QUIZ</span><h1>تحدي معرفة اللاعبين</h1><p>شاهد الصورة واختر اسم اللاعب الصحيح من بين أربعة خيارات!</p></header>
<section class="players-panel"><div class="players-stats"><div><small>السؤال</small><b id="questionNo">1 / 19</b></div><div><small>النقاط</small><b id="currentScore">0</b></div><div><small>الإجابات الصحيحة</small><b id="correctCount">0</b></div></div>
<div class="players-progress"><i id="progressBar"></i></div><div class="player-photo-wrap"><img id="playerPhoto" alt="صورة لاعب كرة قدم" referrerpolicy="no-referrer"><span class="photo-tag">من هو هذا اللاعب؟</span></div>
<div class="players-feedback" id="quizFeedback" aria-live="polite">اختر الإجابة الصحيحة!</div><div class="player-options" id="playerOptions"></div>
<div class="players-finish hidden" id="quizFinish"><div class="trophy">🏆</div><h2>انتهى التحدي!</h2><p id="finalScore"></p><label for="playerName">اكتب اسمك لدخول أفضل 10</label><input id="playerName" maxlength="24" placeholder="اسم اللاعب"><button id="saveScore">سجّل نتيجتي</button><p id="saveStatus"></p><button id="playAgain" class="again">العب من جديد</button></div>
<div class="players-leaderboard"><h2>🏆 أفضل 10 — تحدي معرفة اللاعبين</h2><ol id="top10"></ol></div><p class="photo-credit">صور اللاعبين: <a href="https://geofootballguessr.com/image-credits" target="_blank" rel="noopener">مصادر الصور والتراخيص</a></p></section></main><script type="module" src="players.js"></script></body></html>
